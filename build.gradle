plugins {
    id "fabric-loom" version "1.15.1"
    id "maven-publish"
}

import java.nio.charset.StandardCharsets
import java.util.UUID

version = project.mod_version
group = project.maven_group

// Minecraft changes binary method signatures within this line; compile a JAR for each exact version.
def minecraftVersionRange = project.minecraft_version.toString()
def artifactVersion = "${project.version}+mc${project.minecraft_version}"
def loomRunDir = findProperty("loom_run_dir")
def loomTestUsername = (findProperty("loom_test_username") ?: "NoLostPetsTest").toString()
def loomTestUuid = (findProperty("loom_test_uuid")
        ?: UUID.nameUUIDFromBytes(("OfflinePlayer:" + loomTestUsername).getBytes(StandardCharsets.UTF_8)).toString())
        .toString()
def lanSmokeVmProperties = [
        "nolostpets.lanSmoke.role"    : findProperty("nolostpets_lan_smoke_role"),
        "nolostpets.lanSmoke.dir"     : findProperty("nolostpets_lan_smoke_dir"),
        "nolostpets.lanSmoke.world"   : findProperty("nolostpets_lan_smoke_world"),
        "nolostpets.lanSmoke.port"    : findProperty("nolostpets_lan_smoke_port"),
        "nolostpets.lanSmoke.hostName": findProperty("nolostpets_lan_smoke_host_name"),
        "nolostpets.lanSmoke.peerName": findProperty("nolostpets_lan_smoke_peer_name")
].findAll { key, value -> value != null && value.toString().trim() }

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {
    runs.named("client") {
        programArgs "--username", loomTestUsername, "--uuid", loomTestUuid
        lanSmokeVmProperties.each { key, value ->
            vmArg "-D${key}=${value}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pet_recall_gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Apply the requested directory to the run created by test configuration too.
// Registration and report validation use the same suite manifest.
def gameTestSuitesFile = file("scripts/test-suites.json")
def gameTestSuites = new groovy.json.JsonSlurper().parse(gameTestSuitesFile)
def gameTestSuite = (findProperty("pet_test_suite") ?: "fast").toString().toLowerCase(Locale.ROOT)
if (!gameTestSuites.containsKey(gameTestSuite)) {
    throw new GradleException("Unknown test suite '${gameTestSuite}'; choose fast, regression, stress or full.")
}
def gameTestEntrypoints = gameTestSuites[gameTestSuite].join('",\n      "')

// Each native environment is a separate batch, so shared runtime state is isolated.
def gameTestEnvironmentDir = layout.buildDirectory.dir("generated/gametest-environments")
sourceSets.gametest.resources.srcDir(gameTestEnvironmentDir)
tasks.register("generateGameTestEnvironments") {
    inputs.files(fileTree("src/gametest/java") { include "**/*.java" })
    outputs.dir(gameTestEnvironmentDir)
    doLast {
        def environments = new HashSet<String>()
        fileTree("src/gametest/java").matching { include "**/*.java" }.each { source ->
            (source.getText("UTF-8") =~ /environment\s*=\s*"pet_recall_gametest:isolated\/([a-z0-9_]+)"/).each { match ->
                def id = match[1]
                if (!environments.add(id)) throw new GradleException("Shared GameTest environment: ${id}")
                def resource = new File(gameTestEnvironmentDir.get().asFile, "data/pet_recall_gametest/test_environment/isolated/${id}.json")
                resource.parentFile.mkdirs()
                resource.setText('{"type":"minecraft:all_of","definitions":[]}\n', "UTF-8")
            }
        }
    }
}

loom.runs.configureEach {
    runDir = loomRunDir ?: (name == "gameTest" ? "build/run/gameTest/${project.minecraft_version}/${gameTestSuite}" : "run")
}
loom.runs.named("gameTest") {
    vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file("gametest-results/${project.minecraft_version}-${gameTestSuite}.xml").get().asFile}"
}
tasks.named("runGameTest") {
    doFirst { layout.buildDirectory.dir("gametest-results").get().asFile.mkdirs() }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", minecraftVersionRange
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_range": minecraftVersionRange,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

sourceSets {
    compatTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.gametest.compileClasspath
    }
    upgradeTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
}

def petCompatMods = findProperty("pet_compat_mods")
def petCompatSpec = findProperty("pet_compat_spec")
if (petCompatMods && petCompatSpec) {
    dependencies { modRuntimeOnly fileTree(dir: petCompatMods, include: "*.jar") }
    loom.mods.register("pet_recall_compat_test") { sourceSet sourceSets.compatTest }
    loom.runs.named("gameTest") {
        vmArg "-Dnolostpets.compat.spec=${file(petCompatSpec).absolutePath}"
        vmArg "-Dfabric-api.gametest.filter=pet_recall_compat_test:*"
        vmArg "-Dfabric-api.gametest.report-file=${file(petCompatSpec).parentFile}/gametest-results.xml"
    }
    tasks.named("runGameTest") { dependsOn tasks.named("compatTestClasses") }
}
tasks.named("compileUpgradeTestJava") {
    doFirst {
        if (!(project.minecraft_version.toString() in ["1.21.8", "1.21.9", "1.21.10", "1.21.11"])) {
            throw new GradleException("The saved-world helper targets 1.21.8 through 1.21.11; use verify-world-upgrades.ps1 from the mc-26x checkout.")
        }
    }
}
tasks.register("upgradeTestJar", Jar) {
    from sourceSets.upgradeTest.output
    archiveVersion = artifactVersion
    archiveClassifier = "upgrade-test-dev"
}
tasks.register("remapUpgradeTestJar", net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named("upgradeTestJar")
    inputFile = tasks.named("upgradeTestJar").flatMap { it.archiveFile }
    archiveVersion = artifactVersion
    archiveClassifier = "upgrade-test"
    addNestedDependencies = false
}

tasks.named("jar") {
    archiveVersion = artifactVersion
}

tasks.named("sourcesJar") {
    archiveVersion = artifactVersion
}

tasks.named("remapJar") {
    archiveVersion = artifactVersion
}

tasks.register("stageArtifacts", Copy) {
    dependsOn tasks.named("remapJar"), tasks.named("sourcesJar")
    from(tasks.named("remapJar").flatMap { it.archiveFile })
    from(tasks.named("sourcesJar").flatMap { it.archiveFile })
    into layout.projectDirectory.dir("dist/1.21x/${project.minecraft_version}")
}

tasks.named("build") {
    finalizedBy tasks.named("stageArtifacts")
}

tasks.named("processGametestResources") {
    dependsOn tasks.named("generateGameTestEnvironments")
    inputs.property "pet_test_suite", gameTestSuite
    inputs.file gameTestSuitesFile
    filesMatching("fabric.mod.json") { expand "gametest_entrypoints": gameTestEntrypoints }
}
