plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
    id "maven-publish"
}

import java.nio.charset.StandardCharsets
import java.util.UUID

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

def artifactVersion = project.version.toString()
def loomRunDir = findProperty("loom_run_dir")
def loomTestUsername = (findProperty("loom_test_username") ?: "NoLostPetsTest").toString()
def loomTestUuid = (findProperty("loom_test_uuid")
        ?: UUID.nameUUIDFromBytes(("OfflinePlayer:" + loomTestUsername).getBytes(StandardCharsets.UTF_8)).toString())
        .toString()
def lanSmokeVmProperties = [
        "nolostpets.lanSmoke.role"    : findProperty("nolostpets_lan_smoke_role"),
        "nolostpets.lanSmoke.dir"     : findProperty("nolostpets_lan_smoke_dir"),
        "nolostpets.lanSmoke.world"   : findProperty("nolostpets_lan_smoke_world"),
        "nolostpets.lanSmoke.port"    : findProperty("nolostpets_lan_smoke_port"),
        "nolostpets.lanSmoke.hostName": findProperty("nolostpets_lan_smoke_host_name"),
        "nolostpets.lanSmoke.peerName": findProperty("nolostpets_lan_smoke_peer_name")
].findAll { key, value -> value != null && value.toString().trim() }

base {
    archivesName = project.archives_base_name
}

def minecraftTarget = project.minecraft_version.toString()
if (!(minecraftTarget in ['26.1', '26.1.1', '26.1.2', '26.2', '26.3'])) {
    throw new GradleException("Unsupported Minecraft target: ${minecraftTarget}")
}
sourceSets.main.java.srcDir("src/compat/entities-${minecraftTarget.startsWith('26.1') ? '26.1' : '26.2'}/java")
sourceSets.main.java.srcDir("src/compat/lan-${minecraftTarget.startsWith('26.1') ? '26.1' : minecraftTarget}/java")

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
}

loom {
    runs.configureEach {
        runDir = loomRunDir ?: "run/${project.minecraft_version}/${name}"
    }

    runs.named("client") {
        programArgs "--username", loomTestUsername, "--uuid", loomTestUuid
        lanSmokeVmProperties.each { key, value ->
            vmArg "-D${key}=${value}"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "pet_recall_gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_version", project.fabric_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "fabric_version": project.fabric_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.named("jar") {
    archiveVersion = artifactVersion
}

tasks.named("sourcesJar") {
    archiveVersion = artifactVersion
}

tasks.register("stageArtifacts", Copy) {
    dependsOn tasks.named("jar"), tasks.named("sourcesJar")
    from(tasks.named("jar").flatMap { it.archiveFile })
    from(tasks.named("sourcesJar").flatMap { it.archiveFile })
    into layout.buildDirectory.dir("candidates/${project.minecraft_version}")
}

tasks.named("processGametestResources") {
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filesMatching("fabric.mod.json") {
        expand "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}
